[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymon"
version = "2.0.0"
description = "A Linux system monitor TUI built with psutil and Textual."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["system-monitor", "tui", "psutil", "textual", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
license = { text = "MIT" }
authors = [{ name = "pymon" }]
urls = { Homepage = "https://github.com/kenjaku-dev/pymon", Repository = "https://github.com/kenjaku-dev/pymon", Issues = "https://github.com/kenjaku-dev/pymon/issues" }
dependencies = [
    "psutil>=5.9",
    "textual>=0.50",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12.0"]
gpu-amd = ["pyrsmi>=1.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pyright>=1.1",
]

[project.scripts]
pymon = "pymon.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]